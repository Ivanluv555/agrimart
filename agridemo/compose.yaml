services:
  mysql:
    image: mysql:8.0
    container_name: agri-mysql
    environment:
      MYSQL_DATABASE: agri
      MYSQL_USER: agri
      MYSQL_PASSWORD: agripassword
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
