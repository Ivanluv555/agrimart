spring:
  datasource:
    url: jdbc:h2:mem:trade-tests;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

agrimart.messaging.enabled: false
spring.sql.init.schema-locations: classpath:db/messaging-schema.sql,classpath:db/refund-schema.sql
