server.port: ${SERVER_PORT:8082}
spring.application.name: agrimart-trade-service
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:3307/agrimart_trade?connectionTimeZone=UTC}
spring.datasource.username: ${DB_USERNAME:agrimart_trade}
spring.datasource.password: ${DB_PASSWORD:agrimart_trade_dev}
spring.datasource.driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto: ${DDL_AUTO:validate}
spring.jpa.open-in-view: false
agrimart.service-token: ${SERVICE_TOKEN:dev-service-token}
agrimart.gateway-token: ${GATEWAY_TOKEN:dev-gateway-token}
spring.jpa.properties.hibernate.jdbc.time_zone: UTC
