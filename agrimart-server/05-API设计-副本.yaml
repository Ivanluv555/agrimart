components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 服务端可撤销的不透明访问令牌，有效期 2 小时；当前源码没有实现。
    serviceAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: 内部调用方专用凭据，按调用方及接口授权，配合内网隔离和 HTTPS；不能复用用户 Bearer 令牌。网关必须阻断公网 /internal/**，且不接受客户端伪造的身份头。
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
      description: 页码从 1 开始。
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: 每页最多 100 条。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      description: 按主体与操作隔离。相同键和规范化请求返回原结果；相同键不同请求返回 409；记录至少保留 7 天，业务唯一约束永久防重复。
  schemas:
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,7})\.[0-9]{2}$
      example: '41.00'
      description: 人民币元，固定两位小数，禁止二进制浮点计算；单笔金额不超过 99999999.99。
