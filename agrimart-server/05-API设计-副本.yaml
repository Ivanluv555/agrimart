            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionDto'
      x-service-id: S01
      x-service-name: agrimart-user-service
      x-audience: external
