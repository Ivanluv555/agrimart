            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          description: 输入或参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: 未登录、令牌失效或账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '403':
          description: 缺少所需角色或经营权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '404':
          description: 资源不存在或不属于当前主体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
