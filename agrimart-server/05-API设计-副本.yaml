    get:
      tags:
      - UserController
      operationId: UserController_getMe
      summary: 查询本人资料
      description: S01 返回当前用户本人资料。网关和业务服务通过 U01 验证不透明令牌；角色以用户服务的最新状态为准，不信任客户端身份头。
