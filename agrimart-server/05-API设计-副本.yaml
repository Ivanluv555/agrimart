          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
      x-current-handler: UserController.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      x-service-id: S01
      x-service-name: agrimart-user-service
      x-audience: external
      x-data-boundary: 仅访问本服务数据库；远端数据通过已授权内部 API 获取，不跨库查询或建立跨服务外键。
