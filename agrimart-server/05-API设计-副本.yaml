  /products/{id}:
    get:
      tags:
      - ProductController
      operationId: ProductController_getProductById
      summary: 查询公开商品详情
      description: 可见性规则与商品搜索一致；下架、禁售或无效商家的商品返回 404。商家管理详情使用 /merchant/products/{id}。
