  /merchant-applications:
    post:
      tags:
      - MerchantApplicationController
      operationId: MerchantApplicationController_apply
      summary: 申请商家入驻
      description: ACTIVE/FARMER 可申请；每人最多一条待审核申请。驳回后可重新申请；已批准的商家不能重复申请。
      x-controller: MerchantApplicationController
      x-controller-method: apply
      x-implementation-status: planned
      x-business-rules:
      - BR01
      - BR11
      x-allowed-roles:
      - FARMER
      responses:
        '200':
          description: 操作成功；同步成功业务码为 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMerchantApplicationVo'
        '400':
          description: 输入或参数不合法
