      responses:
        '200':
          description: 操作成功；同步成功业务码为 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMerchantApplicationVo'
        '400':
          description: 输入或参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: 未登录、令牌失效或账号不可用
