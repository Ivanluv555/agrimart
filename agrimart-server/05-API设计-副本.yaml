      x-audience: external
      x-data-boundary: 仅访问本服务数据库；远端数据通过已授权内部 API 获取，不跨库查询或建立跨服务外键。
  /admin/merchant-applications/{applicationId}/decision:
    post:
      tags:
      - AdminMerchantApplicationController
      operationId: AdminMerchantApplicationController_decideApplication
      summary: 审核商家入驻
      description: 只能审核 PENDING。通过后同一事务更新申请并将账号角色改为 MERCHANT；拒绝须说明原因。不得审核自己的申请。
      x-controller: AdminMerchantApplicationController
      x-controller-method: decideApplication
      x-implementation-status: planned
      x-business-rules:
      - BR01
      - BR11
      x-allowed-roles:
      - ADMIN
