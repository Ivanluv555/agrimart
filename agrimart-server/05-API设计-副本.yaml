openapi: 3.0.3
info:
  title: 农惠达开发起步阶段 API 设计
  version: initial-development-three-services-2026-11-05
  description: 目标设计：用户、农资买卖、支付三个独立业务微服务，统一网关、注册与配置中心；三个独立逻辑数据库可共用 MySQL 实例。外部路径通过网关 /api，内部路径仅在服务网络开放；所有目标接口尚待实现，不能据此认定当前原型已支持。
servers:
- url: http://localhost:8080/api
  description: 规划中的统一网关，转发时移除 /api 前缀；不是当前单体已经完成的路由配置。
security:
- bearerAuth: []
tags:
- name: UserController
  description: S01 用户服务
- name: MerchantApplicationController
  description: S01 用户服务
- name: AdminMerchantApplicationController
  description: S01 用户服务
- name: ProductController
  description: S02 农资买卖服务
- name: MerchantProductController
  description: S02 农资买卖服务
- name: AdminProductController
  description: S02 农资买卖服务
- name: CheckoutController
  description: S02 农资买卖服务
- name: OrderController
  description: S02 农资买卖服务
- name: MerchantOrderController
  description: S02 农资买卖服务
- name: PaymentController
  description: S03 支付服务
- name: RefundController
  description: S02 农资买卖服务
- name: MerchantRefundController
  description: S02 农资买卖服务
- name: ReviewController
  description: S02 农资买卖服务
- name: MerchantReviewController
  description: S02 农资买卖服务
- name: PaymentCallbackController
  description: S03 支付服务
- name: InternalAuthController
  description: S01 用户服务
- name: InternalMerchantController
  description: S01 用户服务
- name: InternalOrderController
  description: S02 农资买卖服务
- name: InternalRefundController
  description: S02 农资买卖服务
- name: InternalPaymentController
  description: S03 支付服务
paths:
  /users/register:
    post:
      tags:
      - UserController
      operationId: UserController_register
      summary: 注册农户账号
      description: 仅创建 ACTIVE/FARMER，不接受 role。注册不自动登录；手机号和用户名唯一。
      x-controller: UserController
      x-controller-method: register
      x-implementation-status: existing-needs-change
      x-business-rules:
      - BR01
      x-allowed-roles:
      - PUBLIC
      responses:
        '200':
          description: 操作成功；同步成功业务码为 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserVo'
        '400':
          description: 输入或参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
          description: 业务状态、库存、唯一性或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '500':
          description: 内部异常，不返回内部细节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
      x-current-handler: UserController.register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      x-service-id: S01
      x-service-name: agrimart-user-service
      x-audience: external
      x-data-boundary: 仅访问本服务数据库；远端数据通过已授权内部 API 获取，不跨库查询或建立跨服务外键。
  /users/login:
    post:
      tags:
      - UserController
      operationId: UserController_login
      summary: 登录
      description: 校验账号、密码与 ACTIVE 状态，签发两小时可撤销令牌。错误凭据统一返回 401。
      x-controller: UserController
      x-controller-method: login
      x-implementation-status: existing-needs-change
      x-business-rules:
      - BR01
      x-allowed-roles:
      - PUBLIC
      responses:
        '200':
          description: 操作成功；同步成功业务码为 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAuthVo'
        '400':
          description: 输入或参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '401':
          description: 未登录、令牌失效或账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '409':
