      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProductCategory'
        description: 按分类筛选。
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 100
        description: 商品名称或描述关键词。
      x-service-id: S02
      x-service-name: agrimart-trade-service
      x-audience: external
      x-data-boundary: 仅访问本服务数据库；远端数据通过已授权内部 API 获取，不跨库查询或建立跨服务外键。
