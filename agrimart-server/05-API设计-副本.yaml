  /products:
    get:
      tags:
      - ProductController
      operationId: ProductController_searchProducts
      summary: 搜索公开商品
      description: 仅展示经营权限有效、未受平台禁售且 ON_SALE 的商品。库存为零仍可展示，但不能下单。按创建时间和 ID 倒序。
      x-controller: ProductController
      x-controller-method: searchProducts
      x-implementation-status: existing-needs-change
      x-business-rules:
      - BR02
      - BR13
      x-allowed-roles:
      - PUBLIC
      responses:
