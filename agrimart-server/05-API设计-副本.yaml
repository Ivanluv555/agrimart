  /admin/merchant-applications:
    get:
      tags:
      - AdminMerchantApplicationController
      operationId: AdminMerchantApplicationController_listApplications
      summary: 查询商家入驻申请
      description: 管理员可分页查询并按状态筛选；申请创建时间倒序，相同时间按 ID 倒序。
      x-controller: AdminMerchantApplicationController
      x-controller-method: listApplications
      x-implementation-status: planned
      x-business-rules:
      - BR01
      - BR13
      x-allowed-roles:
      - ADMIN
      responses:
        '200':
          description: 操作成功；同步成功业务码为 200。
