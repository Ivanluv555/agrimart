server.port: ${SERVER_PORT:8081}
spring.application.name: agrimart-user-service
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:3307/agrimart_user?connectionTimeZone=UTC}
spring.datasource.username: ${DB_USERNAME:agrimart_user}
spring.datasource.password: ${DB_PASSWORD:agrimart_user_dev}
spring.datasource.driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto: ${DDL_AUTO:validate}
spring.jpa.open-in-view: false
agrimart.service-token: ${SERVICE_TOKEN:dev-service-token}
spring.jpa.properties.hibernate.jdbc.time_zone: UTC
