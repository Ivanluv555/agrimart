server.port: ${SERVER_PORT:8083}
spring.application.name: agrimart-payment-service
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:3307/agrimart_payment?connectionTimeZone=UTC}
spring.datasource.username: ${DB_USERNAME:agrimart_payment}
spring.datasource.password: ${DB_PASSWORD:agrimart_payment_dev}
spring.datasource.driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto: ${DDL_AUTO:validate}
spring.jpa.open-in-view: false
agrimart.service-token: ${SERVICE_TOKEN:dev-service-token}
payment.provider.configured: ${PAYMENT_PROVIDER_CONFIGURED:false}
agrimart.gateway-token: ${GATEWAY_TOKEN:dev-gateway-token}
spring.jpa.properties.hibernate.jdbc.time_zone: UTC
